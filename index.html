<title>年休メーター</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #F2F2F7;
    --card: #FFFFFF;
    --ink: #1a1a1a;
    --secondary: rgba(60,60,67,0.6);
    --tertiary: rgba(60,60,67,0.3);
    --sep: rgba(60,60,67,0.18);
    --fill: rgba(118,118,128,0.12);
    --blue: #007AFF;
    --red: #FF3B30;
    --accent: #1B9E8A;
    --accent-soft: #D7F2EC;
    --plan: #6FCFBE;
    --reserve: #C7C7CC;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); }
  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
    color: var(--ink); font-size: 16px; -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  button { font-family: inherit; }
  #app {
    position: fixed; left: 0; right: 0; top: var(--app-top, 0px);
    height: var(--app-height, 100%);
    display: flex; flex-direction: column;
    padding-top: var(--safe-top);
  }
  .view { display: none; flex-direction: column; flex: 1; min-height: 0; }
  .view.active { display: flex; }

  .navbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 8px; min-height: 48px; position: relative;
    background: rgba(242,242,247,0.92);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    z-index: 10;
  }
  .navbar .title {
    font-size: 17px; font-weight: 600;
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none; white-space: nowrap;
  }
  .icon-btn {
    width: 40px; min-width: 40px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    color: var(--accent); background: none; border: 0; cursor: pointer; border-radius: 10px;
  }
  .icon-btn:disabled { color: var(--tertiary); }
  .icon-btn:active { background: var(--fill); }

  .scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 16px 24px; }

  .card { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
  .hol { padding: 12px 16px; }
  .hol-top { display: flex; align-items: baseline; justify-content: space-between; }
  .hol-l { font-size: 14px; font-weight: 700; }
  .hol-n { font-size: 26px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
  .hol-n small { font-size: 13px; margin-left: 2px; }
  .hol-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .hol-chip { font-size: 12px; font-weight: 600; background: var(--accent-soft); color: #127A6A; border-radius: 8px; padding: 4px 8px; }
  .hol-chip.past { background: var(--fill); color: var(--secondary); }
  .hol-top.co { margin-top: 10px; padding-top: 8px; border-top: 0.5px solid var(--sep); }
  .hol-n.co { color: #5B6BD6; }
  .hol-chip.co { background: #E6E9FB; color: #3F4DB8; }
  .hol-chip.co.past { background: var(--fill); color: var(--secondary); }
  /* 設定：会社の休み */
  .off-row { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 0.5px solid var(--sep); }
  .off-row .when { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 96px; }
  .off-row .nm { flex: 1; min-width: 0; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .off-row .yr { font-size: 11px; color: #3F4DB8; background: #E6E9FB; border-radius: 6px; padding: 2px 6px; flex-shrink: 0; }
  .off-row .del { border: 0; background: none; color: #D12A20; font: inherit; font-size: 14px; padding: 4px 6px; cursor: pointer; flex-shrink: 0; }
  .off-add { padding: 12px 14px; display: grid; gap: 8px; }
  .off-add input[type=text], .off-add input[type=date] { width: 100%; min-width: 0; font: inherit; font-size: 16px; border: 0; background: var(--fill); border-radius: 10px; padding: 10px 12px; color: var(--ink); -webkit-appearance: none; }
  .off-add .dt { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .off-add .dt span { font-size: 11px; color: var(--secondary); padding-left: 2px; }
  .off-add input[type=date] { display: block; min-height: 44px; text-align: left; }
  .off-add .two { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); gap: 6px; align-items: end; font-size: 13px; color: var(--secondary); }
  .drift { border: 1.5px solid #5B6BD6; }
  .dr-t { font-size: 15px; font-weight: 800; color: #3F4DB8; margin-bottom: 6px; }
  .dr-d { font-size: 14px; line-height: 1.6; }
  .dr-w { font-size: 12px; color: #C27A00; margin-top: 6px; line-height: 1.5; }
  .dr-b { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
  .dr-b button { border: 0; border-radius: 10px; font: inherit; font-size: 14px; font-weight: 700; padding: 10px 14px; cursor: pointer; }
  .dr-no { background: var(--fill); color: var(--secondary); }
  .dr-go { background: #5B6BD6; color: #fff; }
  .rk-seg { margin: 4px 0 10px; }
  .rk-head { display: flex; align-items: center; justify-content: space-between; margin: 0 4px 8px; font-size: 13px; color: var(--secondary); }
  .rk-sort { border: 0; background: none; color: var(--accent); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; padding: 4px 0; }
  .rk-row { display: grid; grid-template-columns: 26px 54px minmax(0,1fr) 56px; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 0.5px solid var(--sep); }
  .rk-row:last-child { border-bottom: 0; }
  .rk-row.cur { background: var(--accent-soft); }
  .rk-row.past { opacity: .55; }
  .rk-n { width: 24px; height: 24px; border-radius: 50%; background: var(--fill); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; color: var(--secondary); }
  .rk-n.top { background: var(--accent); color: #fff; }
  .rk-m { font-size: 16px; font-weight: 700; } .rk-m small { display: block; font-size: 10px; font-weight: 500; color: var(--tertiary); }
  .rk-bar { position: relative; height: 26px; display: flex; align-items: center; }
  .rk-bar i { position: absolute; left: 0; top: 2px; height: 10px; border-radius: 5px; background: #9FD9CD; }
  .rk-bar i.lv { background: repeating-linear-gradient(-45deg, #F3D777 0 3px, #FBEBB0 3px 6px); border-radius: 0 5px 5px 0; }
  .rk-bar em { position: absolute; left: 0; bottom: -1px; font-style: normal; font-size: 10px; color: var(--secondary); white-space: nowrap; }
  .rk-v { text-align: right; font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; } .rk-v small { font-size: 11px; margin-left: 1px; }
  .tab-tg { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border-bottom: 0.5px solid var(--sep); cursor: pointer; }
  .tab-tg:last-child { border-bottom: 0; }
  .tab-tg span { font-size: 15px; }
  .tab-tg small { display: block; font-size: 12px; color: var(--secondary); margin-top: 2px; }
  .sw { -webkit-appearance: none; appearance: none; flex-shrink: 0; width: 51px; height: 31px; border-radius: 16px; background: #E9E9EA; position: relative; cursor: pointer; transition: background .2s; margin: 0; }
  .sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.2); transition: transform .2s; }
  .sw:checked { background: var(--accent); }
  .sw:checked::after { transform: translateX(20px); }
  .off-kind { display: flex; background: var(--fill); border-radius: 10px; padding: 2px; }
  .off-kind button { flex: 1; border: 0; background: none; font: inherit; font-size: 14px; padding: 8px 0; border-radius: 8px; color: var(--ink); cursor: pointer; }
  .off-kind button.on { background: var(--card); box-shadow: 0 1px 4px rgba(0,0,0,.12); font-weight: 700; }
  .off-add .three { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 6px; }
  .off-add select { width: 100%; min-width: 0; font: inherit; font-size: 16px; border: 0; background: var(--fill); border-radius: 10px; padding: 10px 8px; color: var(--ink); -webkit-appearance: none; text-align: center; }
  .off-add .chk { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .off-add .chk input { width: 20px; height: 20px; accent-color: var(--accent); }
  .off-add .go { border: 0; border-radius: 12px; background: var(--accent); color: #fff; font: inherit; font-size: 15px; font-weight: 700; padding: 12px; cursor: pointer; }
  .hol-none { font-size: 12px; color: var(--secondary); margin-top: 4px; }
  .to-plan { width: 100%; display: flex; align-items: center; justify-content: space-between; border: 0; background: var(--card); border-radius: 16px; padding: 16px; font: inherit; font-size: 15px; font-weight: 600; color: var(--ink); cursor: pointer; margin-bottom: 14px; }
  .to-plan span { color: var(--tertiary); font-size: 20px; }
  .to-plan:active { background: var(--fill); }
  .cal { margin-top: 4px; }
  /* ホームのカレンダー */
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .cal-t { font-size: 15px; font-weight: 700; }
  .cal-nav { border: 0; background: var(--fill); color: var(--accent); width: 36px; height: 32px; border-radius: 9px; font-size: 20px; line-height: 1; cursor: pointer; }
  .cal-nav:disabled { opacity: .3; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
  .cw { text-align: center; font-size: 11px; color: var(--secondary); padding-bottom: 2px; }
  .cw.we { color: var(--tertiary); }
  .cd { position: relative; aspect-ratio: 1 / 1; border: 0; background: none; border-radius: 9px; display: flex; flex-direction: column; align-items: center; justify-content: center; font: inherit; padding: 0; cursor: pointer; color: var(--ink); }
  .cd.empty { cursor: default; }
  .cd .n { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .cd .mk { font-size: 9px; font-weight: 800; line-height: 1; margin-top: 2px; }
  .cd.we .n { color: var(--tertiary); }
  .cd.d-hol { background: #FDE7E5; } .cd.d-hol .n { color: #D12A20; }
  .cd.d-co { background: #E6E9FB; } .cd.d-co .n { color: #3F4DB8; }
  .cd.plan { background: var(--accent-soft); box-shadow: inset 0 0 0 1.5px var(--accent); } .cd.plan .n, .cd.plan .mk { color: #127A6A; }
  .cd.took { background: var(--accent); } .cd.took .n, .cd.took .mk { color: #fff; }
  .cd.past:not(.took):not(.plan) { opacity: .45; }
  .cd.today { box-shadow: inset 0 0 0 2px var(--ink); }
  .cd.today.plan { box-shadow: inset 0 0 0 2px var(--ink); }
  .cd:active { transform: scale(.94); }
  .cal-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 10px; font-size: 11px; color: var(--secondary); }
  .cal-legend .lg { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
  .lg-took { background: var(--accent); } .lg-plan { background: var(--accent-soft); box-shadow: inset 0 0 0 1.5px var(--accent); }
  .lg-hol { background: #FDE7E5; box-shadow: inset 0 0 0 1px #F3B3AE; } .lg-co { background: #E6E9FB; box-shadow: inset 0 0 0 1px #B9C0F0; }
  .cal-hint { font-size: 11px; color: var(--tertiary); margin-top: 4px; }
  .section-label { font-size: 13px; color: var(--secondary); margin: 6px 4px 8px; font-weight: 500; }

  /* メーター */
  .meter-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
  .big { font-size: 52px; font-weight: 800; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .big small { font-size: 18px; font-weight: 600; margin-left: 4px; letter-spacing: 0; }
  .big-label { font-size: 13px; color: var(--secondary); margin-bottom: 6px; }
  .of { font-size: 13px; color: var(--secondary); text-align: right; line-height: 1.6; }
  /* いまやること（ひとこと＋次の休みの候補日） */
  .advice .adv-t { font-size: 17px; font-weight: 800; margin-bottom: 4px; }
  .advice .adv-t.ok { color: #127A6A; } .advice .adv-t.warn { color: #C27A00; } .advice .adv-t.ng { color: #D12A20; }
  .advice .adv-d { font-size: 14px; line-height: 1.65; color: var(--ink); }
  .advice .cands { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .advice .cand { border: 1.5px solid var(--accent); background: var(--accent-soft); color: #127A6A; border-radius: 12px; padding: 8px 12px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
  .advice .cand small { display: block; font-size: 11px; font-weight: 500; opacity: .8; }
  .advice .cand:active { transform: scale(.97); }
  .advice .cand-note { font-size: 11.5px; color: var(--secondary); margin-top: 8px; }
  .pill { display: inline-block; padding: 6px 12px; border-radius: 999px; font-size: 14px; font-weight: 700; margin-top: 14px; }
  .pill.ok { background: var(--accent-soft); color: #127A6A; }
  .pill.ng { background: #FFE3E1; color: #D12A20; }
  .bar { position: relative; height: 18px; border-radius: 9px; background: var(--fill); margin-top: 16px; display: flex; overflow: hidden; }
  .bar > div { height: 100%; }
  .seg-used { background: var(--accent); }
  .seg-plan { background: repeating-linear-gradient(-45deg, var(--plan) 0 5px, #9FE0D4 5px 10px); }
  .seg-free { background: transparent; }
  .seg-res { background: repeating-linear-gradient(-45deg, #D1D1D6 0 4px, #E5E5EA 4px 8px); }
  .seg-over { background: repeating-linear-gradient(-45deg, #FF8A80 0 4px, #FFC2BC 4px 8px); }
  .target-mark { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); border-radius: 1px; }
  /* 月あたり何日休めるか（評価つき） */
  .rate { display: flex; align-items: center; gap: 10px; margin-top: 16px; padding: 12px 14px; border-radius: 14px; }
  .rate .badge { flex-shrink: 0; font-size: 14px; font-weight: 800; color: #fff; padding: 6px 12px; border-radius: 999px; }
  .rate .txt { font-size: 14px; font-weight: 600; line-height: 1.45; }
  .rate .txt b { font-size: 22px; font-variant-numeric: tabular-nums; margin: 0 2px; }
  .rate.tight { background: #FFEBE0; } .rate.tight .badge { background: #EF6A2E; } .rate.tight .txt { color: #B4461A; }
  .rate.mid   { background: #FFF5D6; } .rate.mid .badge   { background: #E0A800; } .rate.mid .txt   { color: #8A6800; }
  .rate.easy  { background: var(--accent-soft); } .rate.easy .badge { background: var(--accent); } .rate.easy .txt { color: #127A6A; }
  .rate.over  { background: #FFE3E1; } .rate.over .badge  { background: #D12A20; } .rate.over .txt  { color: #D12A20; }
  .rate-lead { margin-top: 16px; font-size: 13px; color: var(--secondary); line-height: 1.5; }
  .rate-lead b { color: var(--ink); }
  .rate-lead + .rate { margin-top: 8px; }
  .rate .txt .cap { display: block; font-size: 11px; font-weight: 700; opacity: .75; margin-bottom: -2px; }
  .rate.sub { margin-top: 8px; padding: 8px 14px; }
  .rate.sub .badge { font-size: 12px; padding: 4px 10px; }
  .rate.sub .txt { font-size: 13px; } .rate.sub .txt b { font-size: 17px; }
  .kr { margin-top: 14px; padding-top: 12px; border-top: 0.5px solid var(--sep); }
  .kr-hd { font-size: 13px; color: var(--secondary); margin-bottom: 4px; }
  .kr-hd span { font-size: 12px; }
  .sk-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 4px 0; font-size: 13px; }
  .sk-l { font-weight: 600; color: var(--ink); white-space: nowrap; }
  .sk-v { color: var(--secondary); text-align: right; }
  .sk-v b { font-size: 16px; color: var(--ink); font-variant-numeric: tabular-nums; margin: 0 1px; }
  .sk-cur .sk-v b { font-size: 22px; }
  .sk-v b.short { color: #127A6A; } .sk-v b.mid { color: var(--ink); } .sk-v b.long { color: #B4461A; }
  .sk-k { font-size: 10.5px; font-weight: 700; color: var(--secondary); background: var(--fill, rgba(120,120,128,.12)); border-radius: 5px; padding: 1px 5px; margin-left: 3px; }
  .sk-warn { font-size: 11px; font-weight: 800; color: #fff; background: #EF6A2E; border-radius: 999px; padding: 2px 8px; margin-left: 6px; }
  .kr table { width: 100%; border-collapse: collapse; }
  .kr th { font-size: 11px; font-weight: 600; color: var(--secondary); text-align: right; padding: 0 0 2px; }
  .kr td { padding: 6px 0; text-align: right; white-space: nowrap; font-size: 13px; color: var(--secondary); }
  .kr td:first-child { text-align: left; font-size: 14px; font-weight: 600; color: var(--ink); }
  .kr td b { font-size: 18px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .kr td .w { font-size: 12px; }
  .kr td em { display: block; font-style: normal; font-size: 11.5px; font-weight: 700; color: var(--accent); margin-top: -2px; }
  .kr td.none { font-size: 12.5px; }
  .kr-note { font-size: 11.5px; color: var(--secondary); line-height: 1.5; margin-top: 4px; }
  .f5-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .f5-t { font-size: 15px; font-weight: 700; }
  .f5-badge { font-size: 13px; font-weight: 800; color: #fff; border-radius: 999px; padding: 4px 11px; white-space: nowrap; }
  .f5-ok .f5-badge { background: var(--accent); } .f5-mid .f5-badge { background: #E0A800; } .f5-ng .f5-badge { background: #EF6A2E; }
  .f5-bar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-top: 12px; }
  .f5-seg { position: relative; display: flex; height: 14px; border-radius: 5px; overflow: hidden; background: rgba(120,120,128,.14); }
  .f5-seg i { display: block; height: 100%; }
  .f5-seg i.t, .f5-leg i.t { background: var(--accent); }
  .f5-seg i.p, .f5-leg i.p { background: repeating-linear-gradient(135deg, rgba(42,168,146,.55) 0 4px, rgba(42,168,146,.25) 4px 8px); }
  .f5-leg { display: flex; gap: 14px; margin-top: 8px; font-size: 12.5px; color: var(--secondary); }
  .f5-leg span:last-child { margin-left: auto; font-weight: 700; color: var(--ink); }
  .f5-leg i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
  .f5-msg { margin-top: 10px; font-size: 14px; font-weight: 600; line-height: 1.55; }
  .f5-ok .f5-msg { color: #127A6A; } .f5-mid .f5-msg { color: #8A6800; } .f5-ng .f5-msg { color: #B4461A; }
  .f5-note { margin-top: 4px; font-size: 11.5px; color: var(--secondary); }
  .whatif { margin-top: 10px; border: 1px solid var(--separator, #e5e5ea); border-radius: 12px; overflow: hidden; font-size: 13px; }
  .whatif .wi-hd { padding: 8px 12px 4px; font-size: 12px; font-weight: 700; color: var(--secondary); }
  .whatif table { width: 100%; border-collapse: collapse; }
  .whatif th { font-size: 11px; font-weight: 600; color: var(--secondary); text-align: right; padding: 2px 12px 4px; }
  .whatif th:first-child, .whatif td:first-child { text-align: left; }

  .del-btn { width: 100%; border: 0; border-radius: 14px; padding: 14px; font-size: 16px; font-weight: 600; background: var(--card); color: var(--red); cursor: pointer; margin-top: 4px; }

  /* トースト */

    position: fixed; left: 16px; right: 16px; bottom: calc(var(--safe-bottom) + 70px); z-index: 300;
    background: rgba(30,30,30,0.94); color: #fff; border-radius: 14px; padding: 12px 14px 12px 16px;

  #updateBanner svg { display: block; flex-shrink: 0; }
  .bk-card { background: #fff7ed; border: 1px solid #fed7aa; border-radius: 14px; padding: 12px 14px; margin: 12px 0; }
  .bk-card .bk-t { font-weight: 700; color: #c2410c; font-size: 14px; }

  /* キーボードが出ているときも、シートが画面の上にはみ出さないように（見えている高さに収めて中をスクロール） */

</style>

<script>
  // ---------- DOM helper ----------
  const $ = (s) => document.querySelector(s);
  const $$ = (s) => Array.from(document.querySelectorAll(s));

  // ---------- IndexedDB ----------
  // 内部識別子（DB名・スキーマ名）は表示名が変わっても変えない。
  const DB_NAME = (window.NENKYU_DB_NAME || 'nenkyu-db');
  const DB_VERSION = 1;
  // years: { id:'2026', total, target, updatedAt }
  // entries: { id:'2026-10-17', planAmt:null|0.5|1, actAmt:null|0|0.5|1, updatedAt, deleted? }
  const STORES = ['years', 'entries'];
  let _db = null;

  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = () => {
        const db = req.result;
        for (const s of STORES) {
          if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath: 'id' });
        }
      };
      req.onsuccess = () => { _db = req.result; resolve(_db); };
      req.onerror = () => reject(req.error);
    });
  }
  function tx(store, mode = 'readonly') { return _db.transaction(store, mode).objectStore(store); }
  function getAll(store) {
    return new Promise((res, rej) => { const r = tx(store).getAll(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  }
  function put(store, val) {
    return new Promise((res, rej) => { const r = tx(store, 'readwrite').put(val); r.onsuccess = () => res(); r.onerror = () => rej(r.error); });
  }

  // ---------- バージョン ----------
  // リリースのたびに sw.js の CACHE 名とセットで上げる。
  const APP_VERSION = '1.34.0';

  // ---------- 日付・年度 ----------
  const pad = (n) => String(n).padStart(2, '0');
  const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const todayStr = () => ymd(new Date());
  const parse = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const fyOf = (s) => { const y = +s.slice(0, 4), m = +s.slice(5, 7); return m >= 4 ? y : y - 1; };
  const WD = ['日', '月', '火', '水', '木', '金', '土'];
  const md = (s) => { const d = parse(s); return `${d.getMonth() + 1}/${d.getDate()}`; };
  const wd = (s) => WD[parse(s).getDay()];
  const fmt = (n) => (Math.round(n * 10) / 10).toString();
  const amtLabel = (a) => a === 1 ? '全休' : a === 0.5 ? '半休' : '';

  const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  // ---------- 祝日（外部データなし・祝日法ルールで計算） ----------
  const _holCache = new Map();
  function nthMonday(y, m, n) { // m: 1-12
    const first = new Date(y, m - 1, 1).getDay();
    return 1 + ((8 - first) % 7) + (n - 1) * 7;
  }
  function holidaysOf(y) {
    if (_holCache.has(y)) return _holCache.get(y);
    const base = new Set();
    const add = (m, d) => base.add(`${y}-${pad(m)}-${pad(d)}`);
    const k = y - 1980, q = Math.floor(k / 4);
    add(1, 1); add(1, nthMonday(y, 1, 2)); add(2, 11);
    if (y >= 2020) add(2, 23);
    add(3, Math.floor(20.8431 + 0.242194 * k - q));      // 春分の日
    add(4, 29); add(5, 3); add(5, 4); add(5, 5);
    add(7, nthMonday(y, 7, 3)); add(8, 11);
    add(9, nthMonday(y, 9, 3));
    add(9, Math.floor(23.2488 + 0.242194 * k - q));      // 秋分の日
    add(10, nthMonday(y, 10, 2)); add(11, 3); add(11, 23);
    const all = new Set(base);
    // 振替休日：日曜の祝日 → 次の祝日でない日
    for (const s of base) {
      const d = parse(s);
      if (d.getDay() !== 0) continue;
      const n = new Date(d);
      do { n.setDate(n.getDate() + 1); } while (all.has(ymd(n)));
      all.add(ymd(n));
    }
    // 国民の休日：祝日に挟まれた平日
    for (const s of base) {
      const d = parse(s); d.setDate(d.getDate() + 2);
      const mid = new Date(d); mid.setDate(mid.getDate() - 1);
      if (base.has(ymd(d)) && !all.has(ymd(mid)) && mid.getDay() !== 0) all.add(ymd(mid));
    }
    _holCache.set(y, all);
    return all;
  }
  const isHoliday = (s) => holidaysOf(+s.slice(0, 4)).has(s);
  // 祝日の名前（表示用）
  function holidayName(s) {
    if (!isHoliday(s)) return '';
    const y = +s.slice(0, 4), m = +s.slice(5, 7), d = +s.slice(8, 10);
    const k = y - 1980, q = Math.floor(k / 4);
    const fixed = { '1-1': '元日', '2-11': '建国記念の日', '2-23': '天皇誕生日', '4-29': '昭和の日', '5-3': '憲法記念日', '5-4': 'みどりの日', '5-5': 'こどもの日', '8-11': '山の日', '11-3': '文化の日', '11-23': '勤労感謝の日' };
    if (fixed[`${m}-${d}`]) return fixed[`${m}-${d}`];
    if (m === 1 && d === nthMonday(y, 1, 2)) return '成人の日';
    if (m === 3 && d === Math.floor(20.8431 + 0.242194 * k - q)) return '春分の日';
    if (m === 7 && d === nthMonday(y, 7, 3)) return '海の日';
    if (m === 9 && d === nthMonday(y, 9, 3)) return '敬老の日';
    if (m === 9 && d === Math.floor(23.2488 + 0.242194 * k - q)) return '秋分の日';
    if (m === 10 && d === nthMonday(y, 10, 2)) return 'スポーツの日';
    // 前に続く祝日の中に日曜があれば振替休日、なければ国民の休日
    const p = parse(s);
    for (;;) { p.setDate(p.getDate() - 1); if (!isHoliday(ymd(p))) break; if (p.getDay() === 0) return '振替休日'; }
    return '国民の休日';
  }
  // ホームの小さなカレンダー：祝日・会社の休み・予定・取った日を色分け。日付を押すとその日の記録を編集
  function calendarHTML(fy, today) {
    // 表示中の年度の中に収める
    const fyFirst = `${fy}-04`, fyLast = `${fy + 1}-03`;
    if (state.calMonth < fyFirst || state.calMonth > fyLast) state.calMonth = fyOf(today) === fy ? today.slice(0, 7) : fyFirst;
    const [y, m] = state.calMonth.split('-').map(Number);
    const days = new Date(y, m, 0).getDate();
    const lead = new Date(y, m - 1, 1).getDay();
    let cells = '';
    for (let i = 0; i < lead; i++) cells += '<span class="cd empty"></span>';
    for (let d = 1; d <= days; d++) {
      const s = `${y}-${pad(m)}-${pad(d)}`;
      const w = parse(s).getDay();
      const e = state.entries.get(s);
      const live = e && !e.deleted ? e : null;
      const cls = ['cd'];
      if (w === 0 || w === 6) cls.push('we');
      if (isHoliday(s)) cls.push('d-hol');
      else if (companyOff(s)) cls.push('d-co');
      let mark = '';
      if (live && live.actAmt > 0) { cls.push('took'); mark = live.actAmt === 0.5 ? '半' : '休'; }
      else if (live && live.actAmt == null && live.planAmt > 0) { cls.push('plan'); mark = live.planAmt === 0.5 ? '半' : '予'; }
      if (s === today) cls.push('today');
      if (s < today) cls.push('past');
      cells += `<button class="${cls.join(' ')}" data-entry="${s}"><span class="n">${d}</span>${mark ? `<span class="mk">${mark}</span>` : ''}</button>`;
    }
    const prevOk = state.calMonth > fyFirst, nextOk = state.calMonth < fyLast;
    return `<div class="card cal">
      <div class="cal-head"><button class="cal-nav" data-calnav="-1" ${prevOk ? '' : 'disabled'} aria-label="前の月">‹</button><span class="cal-t">${y}年${m}月</span><button class="cal-nav" data-calnav="1" ${nextOk ? '' : 'disabled'} aria-label="次の月">›</button></div>
      <div class="cal-grid">${WD.map((x, i) => `<span class="cw${i === 0 || i === 6 ? ' we' : ''}">${x}</span>`).join('')}${cells}</div>
      <div class="cal-legend"><span><i class="lg lg-took"></i>取った</span><span><i class="lg lg-plan"></i>予定</span><span><i class="lg lg-hol"></i>祝日</span><span><i class="lg lg-co"></i>会社の休み</span></div>
      <div class="cal-hint">日付を押すと、その日の予定・実績を入れられます</div>
    </div>`;
  }

  // 今月の祝日（平日に当たるもの＝休みが増える日だけ数える）
  function monthHolidaysHTML(today) {
    const y = +today.slice(0, 4), m = +today.slice(5, 7);
    const days = new Date(y, m, 0).getDate();
    const list = [];
    for (let d = 1; d <= days; d++) { const s = `${y}-${pad(m)}-${pad(d)}`; if (isHoliday(s)) list.push(s); }
    const weekday = list.filter((s) => { const w = parse(s).getDay(); return w !== 0 && w !== 6; });
    const chips = list.map((s) => `<span class="hol-chip${today > s ? ' past' : ''}">${md(s)}（${wd(s)}）${holidayName(s)}</span>`).join('');
    // 会社の休み（土日・祝日と重ならない日だけ数える）
    const offDays = [];
    for (let d = 1; d <= days; d++) {
      const s = `${y}-${pad(m)}-${pad(d)}`; const o = companyOff(s);
      if (o) offDays.push({ s, o });
    }
    const offCount = offDays.filter(({ s }) => { const w = parse(s).getDay(); return w !== 0 && w !== 6 && !isHoliday(s); }).length;
    const groups = [];   // 同じ設定の連続した日はまとめて表示
    for (const x of offDays) {
      const g = groups[groups.length - 1];
      if (g && g.o === x.o) g.to = x.s; else groups.push({ o: x.o, from: x.s, to: x.s });
    }
    const offChips = groups.map((g) => `<span class="hol-chip co${today > g.to ? ' past' : ''}">${md(g.from)}${g.to !== g.from ? '〜' + md(g.to) : `（${wd(g.from)}）`} ${esc(g.o.name)}</span>`).join('');
    return `<div class="card hol"><div class="hol-top"><span class="hol-l">${m}月の祝日</span><span class="hol-n">${weekday.length}<small>日</small></span></div>
      ${list.length ? `<div class="hol-chips">${chips}</div>` : '<div class="hol-none">今月は祝日がありません</div>'}
      ${offDays.length ? `<div class="hol-top co"><span class="hol-l">会社の休み</span><span class="hol-n co">${offCount}<small>日</small></span></div><div class="hol-chips">${offChips}</div>` : ''}
      ${list.length > weekday.length || offDays.length > offCount ? '<div class="hol-none">土日（会社の休みは祝日も）と重なる日は数に入れていません</div>' : ''}</div>`;
  }
  // 会社の休み（年末年始・創立記念日など）。settings.offs = [{id, name, from, to, yearly}]
  // yearly のとき from/to は 'MM-DD'、そうでなければ 'YYYY-MM-DD'
  const getOffs = () => { const st = state.years.get('settings'); return st && Array.isArray(st.offs) ? st.offs : []; };
  // 「◯月の第N ◯曜日」型：{ kind:'nth', month(0=毎月), nth(1-4, -1=最終), dow(0-6) }
  function nthMatch(o, s) {
    const d = parse(s);
    if (d.getDay() !== o.dow) return false;
    if (o.month && d.getMonth() + 1 !== o.month) return false;
    if (o.nth === -1) { const n = new Date(d); n.setDate(n.getDate() + 7); return n.getMonth() !== d.getMonth(); }
    return Math.ceil(d.getDate() / 7) === o.nth;
  }
  const DOW = ['日', '月', '火', '水', '木', '金', '土'];
  const nthLabel = (o) => `${o.month ? o.month + '月の' : '毎月'}${o.nth === -1 ? '最終' : '第' + o.nth}${DOW[o.dow]}曜`;
  function companyOff(s) {
    const mmdd = s.slice(5);
    for (const o of getOffs()) {
      if (o.kind === 'nth') { if (nthMatch(o, s)) return o; continue; }
      const to = o.to || o.from;
      if (o.yearly) {
        const hit = o.from <= to ? (mmdd >= o.from && mmdd <= to) : (mmdd >= o.from || mmdd <= to); // 年をまたぐ（12/29〜1/3）
        if (hit) return o;
      } else if (s >= o.from && s <= to) return o;
    }
    return null;
  }
  const isBizDay = (s) => { const w = parse(s).getDay(); return w !== 0 && w !== 6 && !isHoliday(s) && !companyOff(s); };

  // 年度末（3/31）までの残り営業日。fromStr を含む。
  function bizDaysBetween(fromStr, toStr) {
    let n = 0;
    const d = parse(fromStr), end = parse(toStr);
    while (d <= end) { if (isBizDay(ymd(d))) n++; d.setDate(d.getDate() + 1); }
    return n;
  }

  // ---------- State ----------
  const state = {
    years: new Map(),
    entries: new Map(),
    calMonth: todayStr().slice(0, 7),   // ホームのカレンダーで見ている月（YYYY-MM）
    fy: fyOf(todayStr()),
    tab: 'homeView',
  };

  async function loadAll() {
    state.years = new Map((await getAll('years')).map((y) => [y.id, y]));
    state.entries = new Map((await getAll('entries')).map((e) => [e.id, e]));
  }

  function liveEntries(fy) {
    return Array.from(state.entries.values())
      .filter((e) => !e.deleted && fyOf(e.id) === fy && (e.planAmt != null || e.actAmt != null))
      .sort((a, b) => a.id.localeCompare(b.id));
  }

  // 状態: plan(これから) / wait(過ぎたが未確定) / done(予定通り) / extra(予定外) / skip(見送り)
  function statusOf(e, today = todayStr()) {
    if (e.actAmt == null) return e.id > today ? 'plan' : 'wait';
    if (e.actAmt === 0) return 'skip';
    return e.planAmt != null ? 'done' : 'extra';
  }

  // ---------- 集計（純粋関数） ----------
  function calc(fy, yearRec, entries, today = todayStr()) {
    const total = yearRec ? yearRec.total : 0;
    const target = yearRec ? yearRec.target : 0;
    let used = 0, pending = 0, planned = 0;
    for (const e of entries) {
      if (e.actAmt != null) used += e.actAmt;
      else if (e.planAmt != null) pending += e.planAmt;
      if (e.planAmt != null) planned += e.planAmt;
    }
    const remain = total - used;              // 今の残り
    const projected = total - used - pending; // 予定を全部取った年度末の残り
    const free = projected - target;          // 目標を守ったうえで、まだ使える日数（負ならオーバー）
    return { fy, total, target, used, pending, planned, remain, projected, free };
  }

  function monthly(fy, entries, today = todayStr()) {
    const rows = [];
    for (let i = 0; i < 12; i++) {
      const m = ((3 + i) % 12) + 1;
      const y = m >= 4 ? fy : fy + 1;
      const key = `${y}-${pad(m)}`;
      let plan = 0, act = 0, has = false, rplan = 0;
      for (const e of entries) {
        if (e.id.slice(0, 7) !== key) continue;
        has = true;
        if (e.planAmt != null) plan += e.planAmt;
        if (e.actAmt != null) { act += e.actAmt; if (e.planAmt != null) rplan += e.planAmt; }
      }
      rows.push({ key, m, plan, act, rplan, has, cur: today.slice(0, 7) === key, past: key < today.slice(0, 7) });
    }
    return rows;
  }

  // ---------- 保存 ----------
  async function saveEntry(id, patch) {
    const prev = state.entries.get(id);
    const next = Object.assign({ id, planAmt: null, actAmt: null }, prev && !prev.deleted ? prev : {}, patch, { updatedAt: Date.now() });
    next.deleted = next.planAmt == null && next.actAmt == null;
    state.entries.set(id, next);
    await put('entries', next);
    return prev ? Object.assign({}, prev) : null;
  }
  async function restoreEntry(id, prevSnapshot) {
    const rec = prevSnapshot
      ? Object.assign({}, prevSnapshot, { updatedAt: Date.now() })
      : { id, planAmt: null, actAmt: null, deleted: true, updatedAt: Date.now() };
    state.entries.set(id, rec);
    await put('entries', rec);
  }
  async function saveYear(fy, patch) {
    const id = String(fy);
    const prev = state.years.get(id) || { id, total: 20, target: 5 };
    const next = Object.assign({}, prev, patch, { updatedAt: Date.now() });
    state.years.set(id, next);
    await put('years', next);
  }

  // ---------- Render ----------
  function render() {
    $('#fyTitle').textContent = `${state.fy}年度`;
    renderHome();
    renderPlans();
    renderRank();
    renderPace('goal');
    renderPace('zero');
    renderSettings();
    applyTabVisibility();
  }

  // 共通設定（years ストアに id:'settings' で保存。内部キーは変えない）
  const DEFAULT_GRANT = 20;
  const getGrant = () => { const st = state.years.get('settings'); return st && st.grant != null ? st.grant : DEFAULT_GRANT; };
  async function saveOffs(offs) {
    const next = Object.assign({}, state.years.get('settings') || { id: 'settings' }, { offs, updatedAt: Date.now() });
    state.years.set('settings', next);
    await put('years', next);
  }
  // 繰越の上限（年度末に残っても、これを超えた分は消える）。未設定なら付与日数（2年で消えるので、ふつうはその年の付与分までしか残らない）
  const getCarryCap = () => { const st = state.years.get('settings'); return st && st.carryCap != null ? st.carryCap : getGrant(); };
  async function saveCarryCap(v) {
    const next = Object.assign({}, state.years.get('settings') || { id: 'settings' }, { carryCap: v, updatedAt: Date.now() });
    state.years.set('settings', next);
    await put('years', next);
  }
  const lostOf = (c) => Math.max(0, c.projected - getCarryCap());
  // 下のタブの表示（目標残し・使い切りは隠せる）。settings.hideTabs = { goalView: true, zeroView: false }
  const getHideTabs = () => { const st = state.years.get('settings'); return (st && st.hideTabs) || {}; };
  async function saveHideTabs(h) {
    const next = Object.assign({}, state.years.get('settings') || { id: 'settings' }, { hideTabs: h, updatedAt: Date.now() });
    state.years.set('settings', next);
    await put('years', next);
  }
  function applyTabVisibility() {
    const h = getHideTabs();
    $$('.tab').forEach((b) => { b.style.display = h[b.dataset.tab] ? 'none' : ''; });
    if (h[state.tab]) switchTab('homeView');
  }
  async function saveGrant(v) {
    const next = Object.assign({}, state.years.get('settings') || { id: 'settings' }, { grant: v, updatedAt: Date.now() });
    state.years.set('settings', next);
    await put('years', next);
  }

  // 前年度の残り（実績ベース）と未確定件数
  function prevYearInfo(fy) {
    const prev = state.years.get(String(fy - 1));
    if (!prev) return null;
    const ents = liveEntries(fy - 1);
    const used = ents.reduce((a, e) => a + (e.actAmt || 0), 0);
    const waits = ents.filter((e) => e.actAmt == null).length;
    return { remain: Math.max(0, prev.total - used), target: prev.target, waits };
  }

  // 前年度の実績が変わって、今年度の繰越が開始時とずれたか
  function carryDrift(fy) {
    const yr = state.years.get(String(fy));
    const info = prevYearInfo(fy);
    if (!yr || !info) return null;
    const now = Math.min(info.remain, getCarryCap());
    const base = yr.startCarry != null ? yr.startCarry : Math.max(0, yr.total - getGrant()); // 古いデータは「年休数−付与」を繰越とみなす
    const diff = Math.round((now - base) * 2) / 2;
    if (Math.abs(diff) < 0.5 || yr.carryAck === now) return null;
    return { now, base, diff, newTotal: Math.max(0, yr.total + diff), waits: info.waits };
  }
  function carryDriftHTML(fy) {
    const d = carryDrift(fy); if (!d) return '';
    const yr = state.years.get(String(fy));
    return `<div class="card drift">
      <div class="dr-t">${fy - 1}年度の実績が変わりました</div>
      <div class="dr-d">繰り越す日数が <b>${fmt(d.base)}日 → ${fmt(d.now)}日</b> になりました。<br>今年度の年休数を <b>${fmt(yr.total)}日 → ${fmt(d.newTotal)}日</b> に直しますか？</div>
      ${d.waits ? `<div class="dr-w">${fy - 1}年度にまだ未確定の予定が${d.waits}件あります。確定すると、また変わることがあります。</div>` : ''}
      <div class="dr-b"><button class="dr-no" data-drift="ack">このままにする</button><button class="dr-go" data-drift="apply">${fmt(d.newTotal)}日に更新</button></div>
    </div>`;
  }
  function bindDrift(root) {
    root.querySelectorAll('[data-drift]').forEach((b) => b.addEventListener('click', async () => {
      const fy = state.fy, d = carryDrift(fy); if (!d) return;
      const yr = state.years.get(String(fy));
      if (b.dataset.drift === 'apply') {
        const before = yr.total;
        await saveYear(fy, { total: d.newTotal, startCarry: d.now, carryAck: null });
        render();
        toast(`年休数を${fmt(before)}日 → ${fmt(d.newTotal)}日に更新しました`, async () => { await saveYear(fy, { total: before, startCarry: d.base }); render(); });
      } else {
        await saveYear(fy, { carryAck: d.now });
        render();
        toast('このままにしました（また実績が変わったらお知らせします）');
      }
    }));
  }

  function setupCardHTML(fy) {
    const info = prevYearInfo(fy);
    const grant = getGrant();
    const t = info ? info.target : 5;
    const carried = info ? Math.min(info.remain, getCarryCap()) : 0;   // 上限を超えた分は消えている
    const start = carried + grant;
    const breakdown = info
      ? `${fy - 1}年度の残り <b>${fmt(info.remain)}</b>${carried < info.remain ? `（繰越の上限で <b>${fmt(carried)}</b>）` : ''} ＋ 付与 <b>${fmt(grant)}</b> ＝ <b>${fmt(start)}</b>日`
      : `前年度の記録がないので、付与 <b>${fmt(grant)}</b>日から。繰越があれば足してください`;
    const warn = info && info.waits
      ? `<div style="font-size:12px;color:#C27A00;margin-top:4px;">${fy - 1}年度に未確定の予定が${info.waits}件あります（残りには含めていません）</div>` : '';
    return `
      <div class="card">
        <div style="font-size:17px;font-weight:700;margin-bottom:6px;">${fy}年度を開始</div>
        <div style="font-size:13px;color:var(--secondary);line-height:1.6;margin-bottom:12px;">${fy}年4月〜${fy + 1}年3月<br>${breakdown}${warn}</div>
        <div class="list" style="background:var(--bg);margin-bottom:8px;">
          ${stepperRow('setupTotal', '年休数', '手で直せます', start)}
          ${stepperRow('setupTarget', '年度末に残したい', '目標', t)}
        </div>
        <div class="hint" style="margin:0 0 12px;">付与日数（${fmt(grant)}日）は設定タブで変えられます</div>
        <button class="primary" id="setupGo">${fy}年度を開始</button>
      </div>`;
  }

  function stepperRow(key, label, sub, val) {
    return `<div class="set-row"><div class="lbl">${label}<small>${sub}</small></div>
      <div class="stepper" data-key="${key}">
        <button data-d="-0.5" aria-label="減らす">−</button>
        <span class="v" data-v="${val}">${fmt(val)}</span>
        <button data-d="0.5" aria-label="増やす">＋</button>
      </div></div>`;
  }

  function meterHTML(c) {
    const T = Math.max(c.total, 0.5);
    const pct = (n) => `${Math.max(0, n) / T * 100}%`;
    const usedW = Math.min(c.used, c.total);
    const planW = Math.min(c.pending, Math.max(0, c.total - usedW));
    const room = Math.max(0, c.total - usedW - planW); // まだ誰にも使われていない
    const free = Math.max(0, room - c.target);
    const res = Math.min(room, c.target);
    const over = Math.max(0, c.target - room);
    const markLeft = Math.max(0, (c.total - c.target)) / T * 100;
    const ok = c.free >= 0;
    const pill = ok
      ? `<span class="pill ok">あと ${fmt(c.free)}日 使える</span>`
      : `<span class="pill ng">目標を ${fmt(-c.free)}日 オーバー</span>`;
    return `
      <div class="card">
        <div class="meter-top">
          <div>
            <div class="big-label">いまの残り</div>
            <div class="big">${fmt(c.remain)}<small>日</small></div>
          </div>
          <div class="of">年休 ${fmt(c.total)}日<br>目標残 ${fmt(c.target)}日</div>
        </div>
        ${rateHTML(c)}
        <div class="counts"><span>取得<b>${fmt(c.used)}</b></span><span>予定<b>${fmt(c.pending)}</b></span><span>まだ使える<b>${fmt(Math.max(0, c.free))}</b></span><span>年度末に残る<b>${fmt(c.projected)}</b>${lostOf(c) >= 0.5 ? `<em class="lost">うち${fmt(lostOf(c))}日消える</em>` : ''}</span></div>
        ${paceHTML(c)}
        ${nextOffHTML(c)}
        ${streakHTML(c)}
      </div>`;
  }

  // 予定も含めて、年度末まで月に何日休めるか（予定＋まだ使える日数 ÷ 残りの月数）
  // 2日未満＝少しシビア／2〜3日未満＝ふつう／3日以上＝余裕あり
  const BIZ_PER_MONTH = 20.4;   // 1か月あたりの営業日（年245日÷12）
  // keep＝年度末に残す日数（目標 or 0＝使い切り）
  function monthRate(c, keep) {
    const p = pace(c);
    if (!p || p.biz <= 0) return null;
    const months = Math.max(p.biz / BIZ_PER_MONTH, 0.5);
    const free = c.projected - keep;
    const days = c.pending + Math.max(0, free);
    const per = days / months;

  // 残り営業日と「何営業日に1回休めるか」
  function pace(c, today = todayStr()) {
    const end = `${c.fy + 1}-03-31`;
    if (today > end) return null; // 過ぎた年度
    let start = today < `${c.fy}-04-01` ? `${c.fy}-04-01` : today;
    if (start === today) {
      const te = state.entries.get(today);
      if (te && !te.deleted && te.actAmt != null) { const d = parse(today); d.setDate(d.getDate() + 1); start = ymd(d); }
    }
    const biz = start > end ? 0 : bizDaysBetween(start, end);

  }
  // 年度末に keep 日を残す（目標 or 0＝使い切り）前提で、使える日数を残りの営業日に均等に割ったペースを守りながら、
  // 次に全休・半休を入れられる最初の日。予定の休みはその日に減るものとして差し引き、
  // 休んだあとも「使える日数 ÷ その後の営業日」がきょうのペースを下回らないかを、その日と以降の予定の日すべてで確かめる
  function nextOffDays(c, keep, today = todayStr()) {
    if (fyOf(today) !== c.fy) return null;
    const end = `${c.fy + 1}-03-31`;
    let start = today;
    const te = state.entries.get(today);
    if (te && !te.deleted && te.actAmt != null) { const d = parse(today); d.setDate(d.getDate() + 1); start = ymd(d); }
    const days = [];
    for (const d = parse(start); ymd(d) <= end; d.setDate(d.getDate() + 1)) { const s = ymd(d); if (isBizDay(s)) days.push(s); }

    for (const e of liveEntries(c.fy)) {

    if (amt > 0) return '半休';

  }
  function streakInfo(c, today = todayStr()) {
    if (fyOf(today) !== c.fy) return null;

    // きょうが休みならきょうを「最後に休んだ日」とする
    let last = null, since = 0;
    for (let d = parse(today), k = 0; k < 400; k++, d.setDate(d.getDate() - 1)) {

  // ---------- いまやること：ひとことアドバイスと、次に休むといい日 ----------
  // 考え方：目標を残したうえで使える日数（free）を、年度末までの営業日に均等に散らす。
  // 最後に休んだ日（取得・予定）から「何営業日に1回」ぶん空いたら次の候補。金曜・月曜に寄せる（3連休になる）。
  function nextCandidates(fy, ents, c, today, gap = 0, byEnd = null) {
    const p = pace(c, today);
    if (!p || p.every == null || c.free < 0.5) return [];
    const end = `${fy + 1}-03-31`;
    const rest = new Set(ents.filter((e) => (e.actAmt != null ? e.actAmt > 0 : e.planAmt > 0)).map((e) => e.id));
    const taken = new Set(ents.map((e) => e.id));
    // 直近の休み（今日以前）

    const out = []; let budget = c.free;

    const d = parse(today); d.setDate(d.getDate() + 1);

  // ---------- 12月末までに年休5日（取得＋予定で判定） ----------
  const FIVE_NEED = 5;

  function renderHome() {

  // ---------- 営業日ランキング：年度の各月の営業日数（祝日・会社の休みを除く） ----------
  function monthBizRows(fy) {
    const rows = [];
    for (let i = 0; i < 12; i++) {
      const m = ((3 + i) % 12) + 1, y = m >= 4 ? fy : fy + 1;
      const days = new Date(y, m, 0).getDate();
      let weekday = 0, hol = 0, co = 0, biz = 0, leave = 0;
      for (let d = 1; d <= days; d++) {
        const s = `${y}-${pad(m)}-${pad(d)}`, w = parse(s).getDay();
        if (w === 0 || w === 6) continue;
        weekday++;
        if (isHoliday(s)) { hol++; continue; }
        if (companyOff(s)) { co++; continue; }
        biz++;
        const e = state.entries.get(s);
        if (e && !e.deleted) leave += e.actAmt != null ? e.actAmt : (e.planAmt || 0);
      }
      rows.push({ key: `${y}-${pad(m)}`, y, m, weekday, hol, co, biz, leave, work: biz - leave });
    }
    return rows;
  }
  function renderRank() {
    const el = $('#rankScroll'); if (!el) return;
    const fy = state.fy, cur = todayStr().slice(0, 7);
    const by = state.rankBy || 'biz';                 // biz=営業日 / work=年休を引いた出勤日
    const asc = !!state.rankAsc;
    const rows = monthBizRows(fy);
    const val = (r) => by === 'work' ? r.work : r.biz;
    const sorted = rows.slice().sort((p, q) => (asc ? val(p) - val(q) : val(q) - val(p)) || (p.key < q.key ? -1 : 1));
    const max = Math.max(...rows.map((r) => r.weekday), 1);
    const total = rows.reduce((s, r) => s + r.biz, 0);
    let rank = 0, prev = null;
    const items = sorted.map((r, i) => {
      if (val(r) !== prev) { rank = i + 1; prev = val(r); }
      const sub = [r.hol ? `祝日 ${r.hol}` : '', r.co ? `会社 ${r.co}` : '', r.leave ? `年休 ${fmt(r.leave)}` : ''].filter(Boolean).join('・');
      return `<div class="rk-row${r.key === cur ? ' cur' : ''}${r.key < cur ? ' past' : ''}">
        <span class="rk-n${rank <= 3 ? ' top' : ''}">${rank}</span>
        <span class="rk-m">${r.m}月<small>${r.y}</small></span>
        <span class="rk-bar"><i style="width:${(by === 'work' ? r.work : r.biz) / max * 100}%"></i>${by === 'work' && r.leave ? `<i class="lv" style="left:${r.work / max * 100}%;width:${r.leave / max * 100}%"></i>` : ''}<em>${sub}</em></span>
        <span class="rk-v">${fmt(val(r))}<small>日</small></span>
      </div>`;
    }).join('');
    el.innerHTML = `
      <div class="seg rk-seg"><button data-rankby="biz" class="${by === 'biz' ? 'on' : ''}">営業日</button><button data-rankby="work" class="${by === 'work' ? 'on' : ''}">年休を引いた出勤日</button></div>
      <div class="rk-head"><span>${fy}年度・${asc ? '少ない' : '多い'}順</span><button class="rk-sort" id="rankSort">${asc ? '多い順にする' : '少ない順にする'}</button></div>
      <div class="list rk">${items}</div>
      <div class="note">営業日＝土日・祝日・会社の休みを除いた日。年度の合計 <b>${total}</b> 営業日。${by === 'work' ? '出勤日は、そこから取った年休・入れてある予定を引いた日数です（半休は0.5日）。' : '数字の横は、その月に平日と重なった祝日・会社の休み・年休の日数です。'}</div>`;
    el.querySelectorAll('[data-rankby]').forEach((b) => b.addEventListener('click', () => { state.rankBy = b.dataset.rankby; renderRank(); }));
    el.querySelector('#rankSort').addEventListener('click', () => { state.rankAsc = !state.rankAsc; renderRank(); });
  }

  // ---------- 予定タブ：カレンダーとこれからの予定 ----------
  function renderPlans() {

  function rowHTML(e, today) {
    const st = statusOf(e, today);
    const chip = {
      plan: `<span class="chip plan">予定</span>`,

  // 月末ごとの目安残：使っていい日数（年休−目標）を営業日の経過に比例して配分
  function paceRows(fy, yr, entries, today = todayStr()) {
    const total = yr.total, target = yr.target;
    const usable = Math.max(0, total - target);
    const fyStart = `${fy}-04-01`, fyEnd = `${fy + 1}-03-31`;
    const allBiz = bizDaysBetween(fyStart, fyEnd) || 1;
    const rows = [];
    for (let i = 0; i < 12; i++) {
      const m = ((3 + i) % 12) + 1;
      const y = m >= 4 ? fy : fy + 1;
      const last = new Date(y, m, 0).getDate();
      const end = `${y}-${pad(m)}-${pad(last)}`;
      const biz = bizDaysBetween(fyStart, end);
      const guide = Math.round((total - usable * biz / allBiz) * 2) / 2; // 0.5刻み
      const zero = Math.round((total - total * biz / allBiz) * 2) / 2;    // 年度末にちょうど0になる線
      let used = 0, pend = 0;
      for (const e of entries) {
        if (e.id > end) continue;
        if (e.actAmt != null) used += e.actAmt;
        else if (e.planAmt != null) pend += e.planAmt;
      }
      const ym = `${y}-${pad(m)}`;
      const kind = ym < today.slice(0, 7) ? 'past' : ym === today.slice(0, 7) ? 'cur' : 'future';
      // 実績残：その月末時点で実際に残っている日数（今月は今日時点、来月以降は未来なので出さない）
      const act = kind === 'future' ? null : total - used;
      // 予定込み：入っている予定を全部取った場合の、その月末の残数（今月以降）
      const withPlan = kind === 'past' ? null : total - used - pend;
      rows.push({ m, end, guide, zero, act, withPlan, kind });
    }
    return rows;
  }

  function renderPace(mode) {
    const el = $(mode === 'goal' ? '#goalScroll' : '#zeroScroll');
    const fy = state.fy;
    const yr = state.years.get(String(fy));
    if (!yr) { el.innerHTML = `<div class="list"><div class="empty">この年度はまだ未設定です</div></div>`; return; }
    const today = todayStr();
    const rows = paceRows(fy, yr, liveEntries(fy), today);
    const goal = mode === 'goal';
    const head = goal
      ? `<div>年休 <b>${fmt(yr.total)}</b> → 年度末 <b>${fmt(yr.target)}</b> 残す</div><div>使える <b>${fmt(Math.max(0, yr.total - yr.target))}</b> 日</div>`

    for (const r of rows) {

      html += `<tr class="${r.kind === 'cur' ? 'cur' : ''}" data-month="${r.end.slice(0, 7)}"><td>${r.m}月</td><td><b>${fmt(line)}</b></td><td>${actTxt}</td><td>${planTxt}</td></tr>`;

      <div class="note">目安残＝${goal ? `この残数以上あれば、年度末に目標の${fmt(yr.target)}日が残るペース` : 'この残数なら、年度末にちょうど0日になるペース'}。土日祝を除いた営業日の経過に合わせて割り振っています（0.5日刻み）。<br>実績残：過ぎた月は実際の月末の残り、今月は今日時点の残り。<br>予定込み：入っている予定を全部取った場合の、その月末の残り（今月以降）。<br>月をタップすると、その月の記録を見たり直したりできます。</div>`;
    el.innerHTML = html;
  }

      const name = el.querySelector('#offLabel').value.trim();
      if (offKind === 'nth') {
        if (!name) { toast('休みの名前を入れてください'); return; }
        const o = { id: 'o' + Date.now().toString(36), name, kind: 'nth',
          month: +el.querySelector('#offMonth').value, nth: +el.querySelector('#offNth').value, dow: +el.querySelector('#offDow').value };
        await saveOffs([...getOffs(), o]);
        renderSettings(); renderHome(); renderPace('goal'); renderPace('zero');
        toast(`「${name}」（${nthLabel(o)}）を追加しました`);
        return;
      }
      const from = el.querySelector('#offFrom').value;
      let to = el.querySelector('#offTo').value || from;
      const yearly = el.querySelector('#offYearly').checked;
      if (!from) { toast('始まりの日を選んでください'); return; }
      if (!name) { toast('名前を入れてください'); return; }
      if (!yearly && to < from) { toast('終わりの日は始まりの日より後にしてください'); return; }
      const o = { id: 'o' + Date.now().toString(36), name, yearly,
        from: yearly ? from.slice(5) : from, to: yearly ? to.slice(5) : to };
      await saveOffs([...getOffs(), o]);
      renderSettings(); renderHome(); renderPace('goal'); renderPace('zero');
      toast(`「${name}」を追加しました`);
    });
    el.querySelectorAll('[data-offdel]').forEach((b) => b.addEventListener('click', async () => {
      if (b.dataset.armed !== '1') { b.dataset.armed = '1'; b.textContent = 'もう1回'; setTimeout(() => { b.dataset.armed = ''; b.textContent = '削除'; }, 3000); return; }
      const o = getOffs().find((x) => x.id === b.dataset.offdel);
      await saveOffs(getOffs().filter((x) => x.id !== b.dataset.offdel));
      renderSettings(); renderHome(); renderPace('goal'); renderPace('zero');
      if (o) toast(`「${o.name}」を消しました`);
    }));
  }

  // ---------- ステッパー ----------
  function bindSteppers(root, onChange) {
    root.querySelectorAll('.stepper').forEach((s) => {
      const v = s.querySelector('.v');
      s.querySelectorAll('button').forEach((b) => {
        b.addEventListener('click', async () => {
          let n = Number(v.dataset.v) + Number(b.dataset.d);
          n = Math.max(0, Math.min(99, Math.round(n * 2) / 2));
          v.dataset.v = n; v.textContent = fmt(n);
          if (onChange) await onChange(s.dataset.key, n);
        });
      });
    });
  }
  function bindSetup(root) {
    const go = root.querySelector('#setupGo');
    if (!go) return;
    go.addEventListener('click', async () => {
      const total = Number(root.querySelector('[data-key="setupTotal"] .v').dataset.v);
      const target = Number(root.querySelector('[data-key="setupTarget"] .v').dataset.v);
      const info = prevYearInfo(state.fy);
      // 開始時点の繰越を覚えておく（あとで前年度の実績が変わったら、差分だけ年休数を直せるように）
      const startCarry = info ? Math.min(info.remain, getCarryCap()) : 0;
      await saveYear(state.fy, { total, target, startCarry });
      render();
      toast(`${state.fy}年度を開始しました`);
    });
  }

  // ---------- 操作（イベント委譲） ----------
  document.addEventListener('click', async (ev) => {
    const t = ev.target.closest('[data-cand],[data-quick],[data-take],[data-skip],[data-entry],[data-month],[data-tab-go],#addPlanBtn,#addPlanBtn2,#exportBtn,#importBtn,.tab');
    if (!t) return;
    if (t.classList.contains('tab')) return switchTab(t.dataset.tab);
    if (t.dataset.tabGo) return switchTab(t.dataset.tabGo);
    if (t.dataset.cand) {
      const id = t.dataset.cand, amt = Number(t.dataset.amt);
      const prev = await saveEntry(id, { planAmt: amt });
      render();
      toast(`${md(id)}（${wd(id)}）を${amtLabel(amt)}で予定に入れました`, async () => { await restoreEntry(id, prev); render(); });
      return;
    }
    if (t.dataset.quick) {
      const amt = Number(t.dataset.quick);
      const id = todayStr();
      const prev = await saveEntry(id, { actAmt: amt });
      render();
      toast(`今日を${amtLabel(amt)}で記録しました`, async () => { await restoreEntry(id, prev); render(); });
      return;
    }
    if (t.dataset.take) {
      const id = t.dataset.take; const e = state.entries.get(id);
      const prev = await saveEntry(id, { actAmt: e.planAmt });
      render();
      toast(`${md(id)} を取得にしました`, async () => { await restoreEntry(id, prev); render(); });
      return;
    }
    if (t.dataset.skip) {
      const id = t.dataset.skip;
      const prev = await saveEntry(id, { actAmt: 0 });
      render();
      toast(`${md(id)} は見送りにしました`, async () => { await restoreEntry(id, prev); render(); });
      return;
    }
    if (t.dataset.entry) return openEditSheet(t.dataset.entry);
    if (t.dataset.month) return openMonthSheet(t.dataset.month);
    if (t.id === 'addPlanBtn' || t.id === 'addPlanBtn2') return openAddSheet();
    if (t.id === 'exportBtn') return exportData();
    if (t.id === 'importBtn') return $('#importFile').click();
  });

  function switchTab(id) {
    state.tab = id;
    $$('.view').forEach((v) => v.classList.toggle('active', v.id === id));
    $$('.tab').forEach((b) => b.classList.toggle('active', b.dataset.tab === id));
    const sc = document.querySelector(`#${id} .scroll`); if (sc) sc.scrollTop = 0;
  }

  $('#prevFY').addEventListener('click', () => { state.fy--; render(); });
  $('#nextFY').addEventListener('click', () => { state.fy++; render(); });

  // ---------- シート ----------
  function openSheet(html) {
    $('#sheet').innerHTML = `<div class="grabber"></div>` + html;
    $('#backdrop').classList.add('show');
    $('#sheet').classList.add('show');
  }
  function closeSheet() {
    $('#backdrop').classList.remove('show');
    $('#sheet').classList.remove('show');
  }
  $('#backdrop').addEventListener('click', closeSheet);

  function defaultPlanDate() {
    // 表示中の年度の範囲で、明日（年度外ならその年度の4/1）
    const d = new Date(); d.setDate(d.getDate() + 1);
    let s = ymd(d);
    if (fyOf(s) !== state.fy) s = s < `${state.fy}-04-01` ? `${state.fy}-04-01` : `${state.fy + 1}-03-31`;
    return s;
  }

  function openAddSheet() {
    let amt = 1;
    const init = defaultPlanDate();
    openSheet(`
      <h3>予定を入れる</h3>
      <div class="field-label">日付</div>
      <input type="date" class="date-input" id="addDate" value="${init}" />
      <div class="seg" id="addAmt"><button data-a="0.5">半休</button><button data-a="1" class="on">全休</button></div>
      <div class="hint" id="addHint"></div>
      <button class="primary" id="addGo">追加</button>`);
    const dateEl = $('#addDate');
    const upd = () => {
      const s = dateEl.value;
      const today = todayStr();
      const ex = s && state.entries.get(s);
      let hint = '';
      if (!s) hint = '日付を選んでください';
      else if (s <= today) hint = '今日以前の日付は「取得済み（予定外）」として記録します';
      else hint = `${fyOf(s)}年度の予定として入れます`;
      if (s && !isBizDay(s)) hint = `${isHoliday(s) ? '祝日' : '土日'}です。営業日ではありませんが、記録はできます`;
      if (ex && !ex.deleted) hint = `この日はすでに記録があります。上書きします`;
      $('#addHint').textContent = hint;
      $('#addGo').textContent = s && s <= today ? '記録する' : '追加';
    };
    dateEl.addEventListener('change', upd); dateEl.addEventListener('input', upd); upd();
    $('#addAmt').addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      amt = Number(b.dataset.a);
      $$('#addAmt button').forEach((x) => x.classList.toggle('on', x === b));
    });
    $('#addGo').addEventListener('click', async () => {
      const s = dateEl.value; if (!s) return;
      const isPast = s <= todayStr();
      const prev = await saveEntry(s, isPast ? { actAmt: amt } : { planAmt: amt });
      closeSheet();
      state.fy = fyOf(s);
      render();
      toast(`${md(s)} を${amtLabel(amt)}で${isPast ? '記録' : '予定'}しました`, async () => { await restoreEntry(s, prev); render(); });
    });
  }

  function openEditSheet(id) {
    const today = todayStr();
    const canAct = id <= today;
    const base = state.entries.get(id) || { id, planAmt: null, actAmt: null };
    let plan = base.deleted ? null : base.planAmt;
    let act = base.deleted ? null : base.actAmt;
    const segBtn = (grp, v, label, cur, dis) => `<button data-g="${grp}" data-v="${v}" class="${String(cur) === String(v) ? 'on' : ''}" ${dis ? 'disabled' : ''}>${label}</button>`;
    const draw = () => {
      openSheet(`
        <h3>${md(id)}（${wd(id)}）</h3>
        <div class="field-label">予定</div>
        <div class="seg">${segBtn('p', 'null', 'なし', plan)}${segBtn('p', 0.5, '半休', plan)}${segBtn('p', 1, '全休', plan)}</div>
        <div class="field-label">実績${canAct ? '' : '（当日になったら入れられます）'}</div>
        <div class="seg">${segBtn('a', 'null', 'まだ', act, !canAct)}${segBtn('a', 0, '取らず', act, !canAct || plan == null)}${segBtn('a', 0.5, '半休', act, !canAct)}${segBtn('a', 1, '全休', act, !canAct)}</div>
        <button class="primary" id="editGo">保存</button>
        <button class="del-btn" id="editDel">この日の記録を削除</button>`);
      $('#sheet').querySelectorAll('.seg button').forEach((b) => b.addEventListener('click', () => {
        const v = b.dataset.v === 'null' ? null : Number(b.dataset.v);
        if (b.dataset.g === 'p') { plan = v; if (plan == null && act === 0) act = null; }
        else act = v;
        draw();
      }));
      $('#editGo').addEventListener('click', async () => {
        const prev = await saveEntry(id, { planAmt: plan, actAmt: act });
        closeSheet(); render();
        toast(plan == null && act == null ? `${md(id)} の記録を消しました` : `${md(id)} を更新しました`, async () => { await restoreEntry(id, prev); render(); });
      });
      $('#editDel').addEventListener('click', async () => {
        const prev = await saveEntry(id, { planAmt: null, actAmt: null });
        closeSheet(); render();
        toast(`${md(id)} の記録を消しました`, async () => { await restoreEntry(id, prev); render(); });
      });
    };
    draw();
    // 再描画のたびに開き直すが、アニメは維持される
  }

  // ---------- トースト（取り消し付き） ----------
  let toastTimer = null, toastUndoFn = null;
  function toast(msg, undoFn) {
    $('#toastMsg').textContent = msg;
    toastUndoFn = undoFn || null;
    $('#toastUndo').style.display = undoFn ? '' : 'none';
    $('#toast').classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $('#toast').classList.remove('show'), 4000);
  }
  $('#toastUndo').addEventListener('click', async () => {
    const fn = toastUndoFn; toastUndoFn = null;
    $('#toast').classList.remove('show');
    if (fn) { await fn(); toast('取り消しました'); }
  });


  // ---------- バックアップ（全アプリ共通の作法） ----------
  // iPhone：共有メニュー →「"ファイル"に保存」→ iCloud Drive「アプリのバックアップ」フォルダ
  // Mac：ダウンロード。ファイル名は「アプリ名_YYYY-MM-DD.json」でそろえる。
  function bkName(app) { const d = new Date(); return `${app}_${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}.json`; }
  // iPhoneの共有シートは、「ファイルに保存」やショートカットで保存できても「キャンセル」と返すことがある。そのときは本人に聞く。
  function bkAskSaved() {
    return new Promise((resolve) => {
      const bg = document.createElement('div');
      bg.style.cssText = 'position:fixed;inset:0;z-index:9500;background:rgba(0,0,0,.32);display:flex;align-items:center;justify-content:center;padding:24px;font-family:inherit';
      bg.innerHTML = '<div style="width:100%;max-width:330px;background:#fff;color:#1c1c1e;border-radius:18px;padding:20px 20px 12px;box-shadow:0 12px 40px rgba(0,0,0,.2)">' +
        '<div style="font-size:16px;font-weight:700;margin-bottom:6px">バックアップは保存できましたか？</div>' +
        '<div style="font-size:14px;line-height:1.6;color:#6e6e73">保存できていれば、バックアップのお知らせを消します。</div>' +
        '<div style="display:flex;justify-content:flex-end;gap:4px;margin-top:12px">' +
        '<button data-v="0" style="border:0;background:none;font:inherit;font-size:15px;padding:10px 12px;color:#6e6e73">やめた</button>' +
        '<button data-v="1" style="border:0;background:none;font:inherit;font-size:15px;font-weight:700;padding:10px 12px;color:#007aff">保存できた</button></div></div>';
      bg.addEventListener('click', (e) => { const b = e.target.closest('button[data-v]'); if (!b) return; bg.remove(); resolve(b.dataset.v === '1'); });
      document.body.appendChild(bg);
    });
  }
  async function bkSave(app, text) { // 戻り値 'ok' | 'cancel'
    const name = bkName(app);
    if (navigator.maxTouchPoints > 0) {
      try {
        const file = new File([text], name, { type: 'application/json' });
        if (navigator.canShare && navigator.share && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return 'ok'; }
      } catch (e) { if (e && e.name === 'AbortError') return (await bkAskSaved()) ? 'ok' : 'cancel'; }
    }
    const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    return 'ok';
  }
  const BK_KEY = 'nenkyu.lastBackupAt', BK_DAYS = 30;
  function bkMark() { try { localStorage.setItem(BK_KEY, String(Date.now())); } catch (e) {} }
  function bkDays() { let t = 0; try { t = Number(localStorage.getItem(BK_KEY) || 0); } catch (e) {} return t ? Math.floor((Date.now() - t) / 86400000) : null; }
  function bkDue() { const d = bkDays(); return d === null || d >= BK_DAYS; }
  function bkText() { const d = bkDays(); return d === null ? 'まだ一度もバックアップしていません' : d === 0 ? '前回のバックアップ：今日' : `前回のバックアップから ${d}日`; }

  // ---------- JSON 書き出し/取り込み（スマートマージ） ----------
  const SCHEMA = 'nenkyu.v1';
  async function exportData() {
    const data = {
      schema: SCHEMA, exportedAt: new Date().toISOString(),
      years: Array.from(state.years.values()),
      entries: Array.from(state.entries.values()),
    };
    if (await bkSave('年休メーター', JSON.stringify(data, null, 2)) !== 'ok') return;
    bkMark();
    toast('書き出しました');
    render();
  }
  async function importData(file) {
    let data;
    try { data = JSON.parse(await file.text()); } catch (e) { toast('読み込めないファイルです'); return; }
    if (data.schema !== SCHEMA) { toast('年休メーターのファイルではありません'); return; }
    let n = 0;
    for (const [store, map] of [['years', state.years], ['entries', state.entries]]) {
      for (const it of (data[store] || [])) {
        const local = map.get(it.id);
        if (!local || (it.updatedAt || 0) > (local.updatedAt || 0)) { await put(store, it); n++; }
      }
    }
    await loadAll(); render();
    toast(`${n}件を取り込みました`);
  }
  $('#importFile').addEventListener('change', async (e) => {
    const f = e.target.files[0]; e.target.value = '';
    if (f) await importData(f);
  });

  // ---------- 起動 ----------
  (async function init() {
    setupViewportTracking();
    await openDB();
    if (window.NENKYU_SEED) await window.NENKYU_SEED({ put, ymd, todayStr });
    await loadAll();
    render();
    // 日付が変わったら（翌朝アプリに戻ったとき）描き直す
    let lastDay = todayStr();
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && todayStr() !== lastDay) {
        lastDay = todayStr(); render();
      }
    });
    window.__nenkyu = { switchTab, openMonthSheet, openAddSheet, openEditSheet, closeSheet, render, state };
  })();

  // ---------- visualViewport（キーボード対策） ----------
  // アプリ全体を「いま見えている範囲」（キーボードの上）にぴったり重ねる。
  // iPhone はキーボードの出入りで見える範囲を少しずつ動かし、通知が来ないこともあるので、入力中は毎フレーム追いかける。
  function setupViewportTracking() {
    const vv = window.visualViewport; if (!vv) return;
    const root = document.documentElement; let baseHeight = vv.height, lastH = -1, lastT = -1, lastK = -1;
    function apply() {
      const h = Math.round(vv.height), t = Math.max(0, Math.round(vv.offsetTop));
      const k = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
      if (h !== lastH) { root.style.setProperty('--app-height', h + 'px'); lastH = h; }
      if (t !== lastT) { root.style.setProperty('--app-top', t + 'px'); lastT = t; }
      if (k !== lastK) { root.style.setProperty('--kb', k + 'px'); lastK = k; }
      document.body.classList.toggle('keyboard-open', h < baseHeight - 120);
    }
    let until = 0, looping = false;
    function follow(ms) {
      until = Math.max(until, performance.now() + ms);
      if (looping) return; looping = true;
      const tick = () => { apply(); const typing = document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName); if (typing || performance.now() < until) requestAnimationFrame(tick); else looping = false; };
      requestAnimationFrame(tick);
    }
    vv.addEventListener('resize', () => follow(600)); vv.addEventListener('scroll', () => follow(600));
    document.addEventListener('focusin', (e) => {
      follow(1200);
      // キーボードが出きったあと、入力欄を見える位置へ
      const el = e.target;
      if (el && /^(INPUT|TEXTAREA)$/.test(el.tagName) && el.type !== 'date') setTimeout(() => { try { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (_) {} }, 350);
    });
    document.addEventListener('focusout', () => follow(1200));
    window.addEventListener('orientationchange', () => { setTimeout(() => { baseHeight = vv.height; follow(600); }, 300); });
    apply();
  }

  // ---------- Service Worker + 自動アップデート ----------
  if ('serviceWorker' in navigator && !window.NENKYU_SEED) {
    window.addEventListener('load', async () => {
      try {
        const swUrl = new URL('sw.js', location.href).href;
        const res = await fetch(swUrl, { method: 'HEAD' });
        if (!res.ok) return;
        const reg = await navigator.serviceWorker.register('sw.js');
        if (reg.waiting && navigator.serviceWorker.controller) showUpdateBanner(reg.waiting);
        reg.addEventListener('updatefound', () => {
          const sw = reg.installing;
          if (!sw) return;
          sw.addEventListener('statechange', () => {
            if (sw.state === 'installed' && navigator.serviceWorker.controller) showUpdateBanner(sw);
          });
        });
        reg.update();
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update(); });
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (refreshing) return; refreshing = true; window.location.reload();
        });
      } catch (e) {}
    });
  }
  function showUpdateBanner(waitingSW) {
    if (document.getElementById('updateBanner')) return;
    const b = document.createElement('button');
    b.id = 'updateBanner';
    b.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg><span>新しいバージョンがあります — タップで更新</span>';
    b.addEventListener('click', () => {
      b.disabled = true; b.querySelector('span').textContent = '更新中…';
      waitingSW.postMessage('SKIP_WAITING');
    });
    document.body.appendChild(b);
    requestAnimationFrame(() => b.classList.add('show'));
  }
</script>
</body>
